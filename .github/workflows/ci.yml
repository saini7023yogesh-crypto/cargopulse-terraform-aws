name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [01-serverless-shipment-tracker, 02-inventory-alerts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -q
        working-directory: ${{ matrix.project }}

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
        working-directory: 03-three-tier-platform
      - run: pytest app/tests -q
        working-directory: 03-three-tier-platform

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - 01-serverless-shipment-tracker/terraform
          - 02-inventory-alerts/terraform
          - 03-three-tier-platform/terraform
          - 04-observability-cost/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}
